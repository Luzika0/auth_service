name: Build and Publish Auth Service Image

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - ".env.example"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: read

# Keep one image build running at a time for this branch.
concurrency:
  group: auth-service-image-main
  cancel-in-progress: true

env:
  # Image repository. Override this in the workflow if your Docker Hub repo differs.
  IMAGE_NAME: panha123456765432/auth-service
  JAVA_VERSION: "21"

jobs:
  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Verify Maven build
        run: mvn -B -ntp clean verify -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare image tags
        id: meta
        shell: bash
        run: |
          echo "sha_tag=${IMAGE_NAME}:sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "latest_tag=${IMAGE_NAME}:latest" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.latest_tag }}
            ${{ steps.meta.outputs.sha_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

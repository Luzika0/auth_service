spring:
  application:
    name: auth_service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      show-sql: ${JPA_SHOW_SQL:false}
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        

  liquibase:
    change-log: classpath:master.xml
    enabled: ${LIQUIBASE_ENABLED:true}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
      connect-timeout: 3s
      timeout: 3s

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: music-service-admin
              uri: ${MUSIC_SERVICE_URL:https://music-service-210534030028.asia-southeast1.run.app}
              predicates:
                - Path=/api/auth/admin/**
              filters:
                - StripPrefix=2

            - id: music-service-song
              uri: ${MUSIC_SERVICE_URL:https://music-service-210534030028.asia-southeast1.run.app}
              predicates:
                - Path=/api/auth/song/**
              filters:
                - StripPrefix=2

            - id: music-service-media
              uri: ${MUSIC_SERVICE_URL:https://music-service-210534030028.asia-southeast1.run.app}
              predicates:
                - Path=/api/auth/media/**
              filters:
                - StripPrefix=2

            - id: music-service-library
              uri: ${MUSIC_SERVICE_URL:https://music-service-210534030028.asia-southeast1.run.app}
              predicates:
                - Path=/api/auth/library/**
              filters:
                - StripPrefix=2

    discovery:
        enabled: false

server:
  port: ${PORT:8181}
  shutdown: graceful

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

jwt:
  access-token:
    secret: ${ACCESS_JWT_KEY}
    expiration: ${JWT_ACCESS_EXPIRATION:900000}
  refresh-token:
    expiration: ${JWT_REFRESH_EXPIRATION:604800000}

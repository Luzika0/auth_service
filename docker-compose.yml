services:
  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: auth-service:local
    container_name: auth-service
    env_file:
      - .env
    environment:
      PORT: "8181"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    ports:
      - "${AUTH_HOST_PORT:-8181}:8181"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: auth-service-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - auth-redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  auth-redis-data:
